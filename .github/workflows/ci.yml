name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test
      - run: mvn -B -q package -DskipTests && java -jar target/skiplist-rectangles-1.0.0.jar examples/P1test1.txt
